<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Champion — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-black:#15100C;
    --bg-black-2:#1D1712;
    --gold:#D4AF37;
    --gold-light:#F0D77B;
    --gold-dim:#8A6E22;
    --wine:#3B1F1F;
    --wine-light:#4E2A2A;
    --cream:#F5EEDC;
    --cream-dim:#C9BFA6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #2A2015 0%, var(--bg-black) 55%),
      var(--bg-black);
    font-family:'Poppins',sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .oc-card{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--bg-black-2) 0%, #120D09 100%);
    border:1px solid rgba(212,175,55,0.25);
    border-radius:24px;
    padding:28px 24px 32px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(212,175,55,0.06);
    position:relative;
    overflow:hidden;
  }
  .oc-card::before{
    content:"";
    position:absolute;
    top:-60%; left:-20%;
    width:140%; height:140%;
    background:conic-gradient(from 0deg, transparent, rgba(212,175,55,0.06), transparent 30%);
    animation:oc-shine 10s linear infinite;
    pointer-events:none;
  }
  @keyframes oc-shine{ to{ transform:rotate(360deg); } }

  .oc-eyebrow{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:6px;
  }
  .oc-title{
    font-family:'Playfair Display',serif;
    font-weight:900;
    font-size:28px;
    line-height:1.15;
    margin:0 0 4px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold) 70%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .oc-sub{
    font-size:13px;
    color:var(--cream-dim);
    margin:0 0 22px;
  }

  .oc-wheel-wrap{
    position:relative;
    width:280px;
    height:280px;
    margin:0 auto 22px;
  }
  .oc-pointer{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--gold);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    z-index:5;
  }
  .oc-pointer::after{
    content:"";
    position:absolute;
    left:-14px; top:-24px;
    width:28px; height:28px;
    border-radius:50%;
    background:var(--gold);
    border:3px solid var(--bg-black-2);
    z-index:6;
  }
  #ocWheel{
    width:280px;
    height:280px;
    border-radius:50%;
    display:block;
    border:6px solid var(--gold);
    box-shadow:
      0 0 0 2px var(--bg-black-2),
      0 0 0 3px rgba(212,175,55,0.4),
      inset 0 0 30px rgba(0,0,0,0.5),
      0 20px 40px rgba(0,0,0,0.6);
    transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  .oc-hub{
    position:absolute;
    top:50%; left:50%;
    width:52px; height:52px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, var(--gold-dim));
    border-radius:50%;
    border:3px solid var(--bg-black-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    z-index:4;
    box-shadow:0 4px 10px rgba(0,0,0,0.5);
  }

  .oc-spin-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:#241A08;
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    cursor:pointer;
    box-shadow:0 10px 20px -6px rgba(212,175,55,0.5);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .oc-spin-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 14px 24px -6px rgba(212,175,55,0.65); }
  .oc-spin-btn:active:not(:disabled){ transform:translateY(0); }
  .oc-spin-btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
    box-shadow:none;
  }

  .oc-result{
    margin-top:16px;
    min-height:20px;
    font-size:13px;
    color:var(--cream-dim);
  }
  .oc-result.win{ color:var(--gold-light); font-weight:600; }
  .oc-result.lock{ color:#D99A9A; }

  .oc-code-box{
    margin-top:10px;
    display:none;
    background:rgba(212,175,55,0.08);
    border:1px dashed var(--gold-dim);
    border-radius:10px;
    padding:10px 14px;
    font-family:'Poppins',sans-serif;
    letter-spacing:2px;
    font-weight:700;
    color:var(--gold-light);
    font-size:15px;
  }

  .oc-cta{
    display:none;
    margin-top:14px;
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold-light);
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="oc-card">
  <div class="oc-eyebrow">Order Champion</div>
  <h1 class="oc-title">Spin &amp; Win</h1>
  <p class="oc-sub">Isang beses lang ang ikot. Panalo agad ang may order! 🎯</p>

  <div class="oc-wheel-wrap">
    <div class="oc-pointer"></div>
    <canvas id="ocWheel" width="560" height="560"></canvas>
    <div class="oc-hub">👑</div>
  </div>

  <button class="oc-spin-btn" id="ocSpinBtn">SPIN THE WHEEL</button>

  <div class="oc-result" id="ocResult"></div>
  <div class="oc-code-box" id="ocCodeBox"></div>
  <button class="oc-cta" id="ocCta">🛍️ Place an Order to Unlock Prizes</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('ocWheel');
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const center = size/2;
  const radius = size/2 - 6;

  // Segment 7 ("Order Muna!") is reserved for customers with no order yet.
  // Buyers never land on it — it's excluded from the weighted pool below.
  const segments = [
    { label:'10% OFF',        sub:'Next Order',    color:'#D4AF37', weight:40, code:'CHAMP10' },
    { label:'FREE',           sub:'Shipping',      color:'#3B1F1F', weight:36, code:'FREESHIP' },
    { label:'₱50 OFF',        sub:'Coupon',        color:'#D4AF37', weight:32, code:'SAVE50' },
    { label:'TRY AGAIN',      sub:'Next Order',    color:'#3B1F1F', weight:28, code:null },
    { label:'FREE',           sub:'Soap Sample',   color:'#D4AF37', weight:26, code:'FREESOAP' },
    { label:'₱100 OFF',       sub:'Coupon',        color:'#3B1F1F', weight:14, code:'SAVE100' },
    { label:'👑 JACKPOT',     sub:'₱200 OFF',      color:'#D4AF37', weight:6,  code:'JACKPOT200' },
    { label:'📱 BRAND NEW',   sub:'Phone!',        color:'#5C1F1F', weight:1,  code:'MEGA-PHONE', mega:true },
    { label:'✈️ FREE TRAVEL', sub:'Nationwide',    color:'#5C1F1F', weight:1,  code:'MEGA-TRAVEL', mega:true },
    { label:'ORDER MUNA!',    sub:'Then Spin',     color:'#2A2119', weight:0,  code:null, lockedSeg:true }
  ];

  const segAngle = 360 / segments.length;

  function drawWheel(){
    ctx.clearRect(0,0,size,size);
    segments.forEach((seg, i) => {
      const start = (i * segAngle - 90) * Math.PI/180;
      const end = ((i+1) * segAngle - 90) * Math.PI/180;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();
      ctx.strokeStyle = seg.mega ? '#F0D77B' : 'rgba(212,175,55,0.35)';
      ctx.lineWidth = seg.mega ? 3 : 2;
      ctx.stroke();

      // text
      const mid = (start+end)/2;
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.fillStyle = seg.color === '#D4AF37' ? '#241A08' : '#F5EEDC';
      ctx.font = '700 16px Poppins, sans-serif';
      ctx.fillText(seg.label, radius - 16, 5);
      ctx.font = '500 11px Poppins, sans-serif';
      ctx.fillText(seg.sub, radius - 16, 21);
      ctx.restore();
    });
  }
  drawWheel();

  let currentRotation = 0;
  let hasSpun = false; // In-memory only for this demo.
                        // In production, persist this per customer — e.g. a
                        // flag in your Sheets "Customers" row, checked via
                        // Apps Script, or localStorage keyed by phone/account
                        // if you don't need server-side enforcement.

  const spinBtn = document.getElementById('ocSpinBtn');
  const resultEl = document.getElementById('ocResult');
  const codeBox = document.getElementById('ocCodeBox');
  const ctaBtn = document.getElementById('ocCta');

  function weightedPick(pool){
    const total = pool.reduce((s,seg)=>s+seg.weight,0);
    let r = Math.random()*total;
    for(const seg of pool){
      if(r < seg.weight) return seg;
      r -= seg.weight;
    }
    return pool[pool.length-1];
  }

  // Placeholder — set to false for now so the wheel always lands on
  // "ORDER MUNA!" (no real prizes given out yet). Flip back to the real
  // backend check below once you're ready to go live with rewards.
  //   async function checkCustomerHasOrdered(){
  //     const res = await fetch(`${API_URL}?action=checkOrder&ref=${customerRef}`);
  //     const data = await res.json();
  //     return data.hasOrdered;
  //   }
  function checkCustomerHasOrdered(){
    return false;
  }

  function spin(){
    if(hasSpun) return;

    // TODO: replace with a real check against your Apps Script / Sheets
    // backend — e.g. fetch(`${API_URL}?action=checkOrder&ref=XXX`) and
    // read whether that customer has a completed order on file.
    const hasOrdered = checkCustomerHasOrdered();

    let targetIndex;
    if(!hasOrdered){
      // Always lands on "ORDER MUNA!" — no real prize without an order.
      targetIndex = segments.findIndex(s => s.lockedSeg);
    } else {
      const eligible = segments.filter(s => !s.lockedSeg);
      const chosen = weightedPick(eligible);
      targetIndex = segments.indexOf(chosen);
    }

    const targetSeg = segments[targetIndex];
    const midAngle = targetIndex * segAngle + segAngle/2;
    const extraSpins = 6;
    const rotation = currentRotation + extraSpins*360 + ((360 - midAngle) % 360);

    currentRotation = rotation;
    hasSpun = true;
    spinBtn.disabled = true;
    spinBtn.textContent = 'SPINNING…';
    resultEl.className = 'oc-result';
    resultEl.textContent = '';
    codeBox.style.display = 'none';
    ctaBtn.style.display = 'none';

    canvas.style.transform = `rotate(${rotation}deg)`;

    setTimeout(() => {
      if(targetSeg.lockedSeg){
        spinBtn.textContent = 'SPIN USED';
        resultEl.className = 'oc-result lock';
        resultEl.textContent = 'Wala pang order, wala pang prize. Order muna to unlock your next spin!';
        ctaBtn.style.display = 'block';
      } else if(targetSeg.code === null){
        spinBtn.textContent = 'SPIN USED';
        resultEl.className = 'oc-result';
        resultEl.textContent = 'So close! Try again on your next order for another chance.';
      } else {
        spinBtn.textContent = 'SPIN USED';
        resultEl.className = 'oc-result win';
        resultEl.textContent = targetSeg.mega
          ? `🏆 JACKPOT! You won ${targetSeg.label.replace('📱 ','').replace('✈️ ','')} ${targetSeg.sub} — our team will contact you to claim it!`
          : `🎉 You won: ${targetSeg.label} ${targetSeg.sub}!`;
        codeBox.style.display = 'block';
        codeBox.textContent = targetSeg.code;
      }
    }, 4600);
  }

  spinBtn.addEventListener('click', spin);
  ctaBtn.addEventListener('click', () => {
    window.location.href = 'https://github.com/tmenshs/OBEs/tree/main/spin';
  });
})();
</script>

</body>
</html>
