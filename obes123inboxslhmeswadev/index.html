<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBE's Inbox</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ee;
    --panel:#fffdf8;
    --panel-2:#ffffff;
    --gold:#b8862f;
    --gold-light:#e8c37a;
    --ink:#1c1710;
    --ink-2:#4a4234;
    --line:#e7dcc4;
    --unread:#c9503a;
    --text-dim:#a08c6e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'DM Sans', -apple-system, sans-serif;
    background:var(--cream);
    color:var(--ink);
    height:100vh;
    overflow:hidden;
  }
  .app{
    display:flex;
    height:100vh;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    width:320px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .sidebar-header{
    padding:18px 20px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-header h1{
    font-family:'DM Mono', monospace;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .sidebar-header p{
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .chat-list{
    flex:1;
    overflow-y:auto;
  }
  .chat-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 20px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background 0.15s;
  }
  .chat-item:hover{ background:rgba(184,134,47,0.05); }
  .chat-item.active{ background:rgba(184,134,47,0.12); }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#2a1d05;flex-shrink:0;
    font-size:14px;
  }
  .chat-meta{ flex:1; min-width:0; }
  .chat-meta .name-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .chat-meta .name{
    font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chat-item.unread .name{ font-weight:700; }
  .chat-meta .time{ font-size:11px; color:var(--text-dim); flex-shrink:0; }
  .chat-meta .preview{
    font-size:12.5px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;
    display:flex; align-items:center;
  }
  .chat-item.unread .preview{ color:var(--ink); }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--unread); flex-shrink:0; margin-right:5px;
  }
  .empty-list{
    padding:30px 20px; color:var(--text-dim); font-size:13px; text-align:center;
  }

  /* ===== Thread ===== */
  .thread{
    flex:1;
    display:flex;
    flex-direction:column;
    background:var(--cream);
  }
  .thread-header{
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    flex-shrink:0;
    background:var(--panel);
  }
  .thread-header .name{ font-weight:700; font-size:15px; color:var(--ink); }
  .thread-header .email{ font-size:12px; color:var(--text-dim); }
  .thread-body{
    flex:1;
    overflow-y:auto;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bubble{
    max-width:60%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.in{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .bubble.out{
    align-self:flex-end;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:#2a1d05;
    font-weight:500;
    border-bottom-right-radius:4px;
  }
  .bubble.out.pending{ opacity:0.6; }
  .bubble-time{
    font-size:10px; color:var(--text-dim); margin-top:3px;
  }
  .bubble.out .bubble-time{ color:rgba(42,29,5,0.6); }
  .placeholder{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:14px;
  }

  /* ===== Composer ===== */
  .composer{
    border-top:1px solid var(--line);
    padding:14px 24px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--panel);
  }
  .saved-replies{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .saved-replies button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink-2);
    font-size:11.5px;
    padding:5px 10px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.15s;
  }
  .saved-replies button:hover{
    border-color:var(--gold); color:var(--gold);
  }
  .composer-row{
    display:flex; gap:10px; align-items:flex-end;
  }
  .composer-row textarea{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--ink);
    padding:10px 14px;
    font-family:inherit;
    font-size:14px;
    resize:none;
    max-height:120px;
    min-height:42px;
    overflow-y:auto;
    line-height:1.4;
  }
  .composer-row textarea:focus{
    outline:none; border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(184,134,47,0.12);
  }
  .send-btn{
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:#2a1d05;
    border:none;
    border-radius:10px;
    padding:11px 20px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    flex-shrink:0;
    transition:filter 0.15s, transform 0.15s;
  }
  .send-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .send-btn:hover:not(:disabled){ filter:brightness(1.05); transform:translateY(-1px); }
  .composer-error{
    font-size:11.5px; color:var(--unread); display:none;
  }
  .composer-error.show{ display:block; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>OBE's Inbox</h1>
      <p id="statusLine">Loading conversations…</p>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <div class="thread" id="threadPanel">
    <div class="placeholder">Select a conversation to reply</div>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const API_URL = "https://script.google.com/macros/s/AKfycbxL9hbkxyeyEnyvxbN4pv22rZX57whaP5LnLaSdYtP9RZfbydGbrBHYjLGUZmaK2RJp/exec"; // deployed code.gs web app URL
const POLL_INTERVAL_MS = 4000;
// ====================================================

let activeEmail = null;
let activeName = "";
let chats = [];
let savedReplies = [];
let drafts = {};          // email -> unsent draft text, kept across thread switches
let lastRenderedCount = {}; // email -> number of messages last shown, to avoid needless re-paints

// If code.gs's doGet doesn't have a "thread" case wired to getThread_() yet,
// every ?action=thread call comes back as {error:"Unknown action"} instead
// of an array — same for "chats" or "replies" if those ever error out.
// This guard keeps a bad response from breaking chats.length / messages.map;
// it just treats it as "nothing yet" and lets the next poll tick retry.
function asArray(data){
  return Array.isArray(data) ? data : null;
}

const chatListEl = document.getElementById("chatList");
const threadPanel = document.getElementById("threadPanel");
const statusLine = document.getElementById("statusLine");

function fmtTime(t){
  const d = new Date(t);
  if (isNaN(d)) return "";
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay
    ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    : d.toLocaleDateString([], {month:'short', day:'numeric'});
}

function initials(name){
  if (!name) return "?";
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join("");
}

function escapeHtml(str){
  return (str || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

// ===================== SIDEBAR (chat list) =====================

async function loadChats(){
  try{
    const res = await fetch(`${API_URL}?action=chats`);
    const data = await res.json();
    const list = asArray(data);
    if (list === null) throw new Error((data && data.error) || "bad response");
    chats = list;
    renderChatList();
    statusLine.textContent = chats.length + " conversation" + (chats.length===1?"":"s");
  }catch(err){
    statusLine.textContent = "Connection error — retrying…";
  }
}

function renderChatList(){
  if (!chats.length){
    chatListEl.innerHTML = `<div class="empty-list">No messages yet.</div>`;
    return;
  }
  chatListEl.innerHTML = chats.map(c => `
    <div class="chat-item ${c.unread ? "unread":""} ${c.email===activeEmail ? "active":""}" data-email="${escapeHtml(c.email)}">
      <div class="avatar">${initials(c.name)}</div>
      <div class="chat-meta">
        <div class="name-row">
          <span class="name">${escapeHtml(c.name || c.email)}</span>
          <span class="time">${fmtTime(c.lastTime)}</span>
        </div>
        <div class="preview">${c.unread ? '<span class="dot"></span>' : ""}${escapeHtml((c.lastMessage||"").slice(0,40))}</div>
      </div>
    </div>
  `).join("");

  chatListEl.querySelectorAll(".chat-item").forEach(el => {
    el.addEventListener("click", () => openThread(el.dataset.email));
  });
}

// ===================== THREAD =====================

async function openThread(email){
  if (email === activeEmail) return; // already open, don't rebuild and blow away the draft
  activeEmail = email;
  const chat = chats.find(c => c.email === email);
  activeName = chat ? chat.name : email;

  renderChatList();
  if (!savedReplies.length) await loadSavedReplies();
  buildThreadShell();
  lastRenderedCount[activeEmail] = -1; // force first paint
  await refreshMessages();
  markRead(email);
}

// Builds the header + empty message list + composer ONCE per thread open.
// Polling never touches this again, so whatever the owner is mid-typing
// in the reply box is never wiped out or defocused.
function buildThreadShell(){
  threadPanel.innerHTML = `
    <div class="thread-header">
      <div class="avatar">${initials(activeName)}</div>
      <div>
        <div class="name">${escapeHtml(activeName || activeEmail)}</div>
        <div class="email">${escapeHtml(activeEmail)}</div>
      </div>
    </div>
    <div class="thread-body" id="threadBody"></div>
    <div class="composer">
      <div class="saved-replies" id="savedRepliesRow">
        ${savedReplies.map(r => `<button type="button" data-msg="${encodeURIComponent(r.message)}">${escapeHtml(r.label)}</button>`).join("")}
      </div>
      <div class="composer-row">
        <textarea id="replyInput" placeholder="Type a reply…" rows="1">${escapeHtml(drafts[activeEmail] || "")}</textarea>
        <button class="send-btn" id="sendBtn" type="button">Send</button>
      </div>
      <div class="composer-error" id="composerError">Couldn't send. Try again.</div>
    </div>
  `;

  const input = document.getElementById("replyInput");
  autoGrow(input);
  input.focus();
  // place cursor at the end of any restored draft
  input.selectionStart = input.selectionEnd = input.value.length;

  input.addEventListener("input", () => {
    autoGrow(input);
    drafts[activeEmail] = input.value;
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendReply();
    }
  });

  document.getElementById("sendBtn").addEventListener("click", sendReply);

  document.querySelectorAll("#savedRepliesRow button").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = document.getElementById("replyInput");
      box.value = decodeURIComponent(btn.dataset.msg);
      drafts[activeEmail] = box.value;
      autoGrow(box);
      box.focus();
      box.selectionStart = box.selectionEnd = box.value.length;
    });
  });
}

function autoGrow(textarea){
  textarea.style.height = "auto";
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
}

// Fetches the thread and repaints ONLY the message bubbles — safe to call
// on every poll tick without disturbing the composer.
async function refreshMessages(){
  if (!activeEmail) return;
  try{
    const res = await fetch(`${API_URL}?action=thread&email=${encodeURIComponent(activeEmail)}`);
    const data = await res.json();
    const messages = asArray(data);
    if (messages === null) throw new Error((data && data.error) || "bad response");
    paintBubbles(messages);
  }catch(err){
    // silent — next poll tick will retry
  }
}

function paintBubbles(messages){
  const body = document.getElementById("threadBody");
  if (!body) return; // thread panel changed since this fetch started

  // Skip the repaint if nothing new arrived, so scroll position never jumps
  // while the owner is reading back through the conversation.
  if (lastRenderedCount[activeEmail] === messages.length) return;
  lastRenderedCount[activeEmail] = messages.length;

  const wasNearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 80;

  body.innerHTML = messages.map(m => `
    <div class="bubble ${m.direction}">
      ${escapeHtml(m.text)}
      <div class="bubble-time">${fmtTime(m.time)}</div>
    </div>
  `).join("");

  if (wasNearBottom) body.scrollTop = body.scrollHeight;
}

async function loadSavedReplies(){
  try{
    const res = await fetch(`${API_URL}?action=replies`);
    const data = await res.json();
    savedReplies = asArray(data) || [];
  }catch(err){
    savedReplies = [];
  }
}

// ===================== SEND =====================

async function sendReply(){
  const input = document.getElementById("replyInput");
  const errorEl = document.getElementById("composerError");
  const text = input.value.trim();
  if (!text || !activeEmail) return;

  const emailAtSendTime = activeEmail;
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  errorEl.classList.remove("show");
  input.value = "";
  delete drafts[emailAtSendTime];
  autoGrow(input);

  // Optimistic bubble so the reply feels instant, marked "pending" until confirmed.
  const body = document.getElementById("threadBody");
  if (body){
    body.insertAdjacentHTML("beforeend", `
      <div class="bubble out pending" data-pending="1">
        ${escapeHtml(text)}
        <div class="bubble-time">Sending…</div>
      </div>
    `);
    body.scrollTop = body.scrollHeight;
  }

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body: `action=ownerReply&email=${encodeURIComponent(emailAtSendTime)}&text=${encodeURIComponent(text)}`
    });
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    lastRenderedCount[emailAtSendTime] = -1; // force a real repaint to replace the pending bubble
    if (emailAtSendTime === activeEmail) await refreshMessages();
    await loadChats();
  }catch(err){
    // restore the draft so nothing typed is lost
    if (emailAtSendTime === activeEmail){
      input.value = text;
      drafts[emailAtSendTime] = text;
      autoGrow(input);
      errorEl.classList.add("show");
    }
    const pending = document.querySelector('.bubble.out[data-pending="1"]');
    if (pending) pending.remove();
  }finally{
    if (emailAtSendTime === activeEmail) btn.disabled = false;
  }
}

async function markRead(email){
  try{
    await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body: `action=markRead&email=${encodeURIComponent(email)}`
    });
    await loadChats();
  }catch(err){}
}

// ===================== POLLING =====================
// Sidebar always refreshes. The open thread only repaints its bubbles —
// the composer itself (and whatever's being typed in it) is never touched.
setInterval(async () => {
  await loadChats();
  if (activeEmail) await refreshMessages();
}, POLL_INTERVAL_MS);

loadChats();
</script>

</body>
</html>
